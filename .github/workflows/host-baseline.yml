name: Upstream host test inventory

on:
  push:
    branches: [engineering/instrumented-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Attempt all upstream host checks
        run: python tools/ci/run_host_checks.py --output work/upstream-host --timeout 180
      - name: Retain each result, including failures and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-host-${{ matrix.os }}
          path: work/upstream-host/
          retention-days: 14
