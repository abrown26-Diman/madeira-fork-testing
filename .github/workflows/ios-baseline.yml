name: iOS baseline build (readiness gated)

on:
  push:
    branches: [engineering/instrumented-baseline]
  workflow_dispatch:
    inputs:
      package_ipa:
        description: Package an unsigned IPA after a successful build (requires distribution rights for all bundled components)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      PACKAGE_IPA: ${{ inputs.package_ipa && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ci
          brew install cmake ninja meson bison pkg-config autoconf automake libtool ccache llvm 2>&1 | tee work/ci/install.txt
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Record runner and SDK versions
        run: |
          { sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; brew list --versions; python3 --version; } > work/ci/host.txt
      # Deliberately fails on today's clean checkout: see docs/BUILD_AND_TEST.md.
      # Do not make this continue-on-error or download an unproven seed archive.
      - name: Native build readiness
        run: python3 tools/ci/audit_inputs.py --require-native --output work/ci/native-inputs.json
      - name: Compile and optionally package
        shell: bash
        run: |
          set -euo pipefail
          bash build/ci/build-ios.sh 2>&1 | tee work/ci/native-build.txt
      - name: Preserve compiler and linker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-evidence
          path: |
            work/ci/
            build/**/*.err
            build/**/err-*.txt
            build/**/*.log
            work/DerivedData/Logs/Build/
          retention-days: 14
      - name: Unsigned package (only after success)
        if: success() && inputs.package_ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Madeira-unsigned-${{ github.sha }}
          path: work/package/
          if-no-files-found: error
          retention-days: 7
