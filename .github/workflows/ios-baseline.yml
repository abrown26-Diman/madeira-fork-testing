name: iOS native baseline

on:
  push:
    branches: [engineering/native-ios-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      PACKAGE_IPA: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ci
          brew install cmake ninja meson bison pkg-config autoconf automake libtool ccache llvm 2>&1 | tee work/ci/install.txt
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.app
      - name: Record runner and SDK versions
        run: |
          { sw_vers; uname -m; xcodebuild -version; xcrun swiftc --version; xcrun --sdk iphoneos --show-sdk-version; brew list --versions; python3 --version; cargo --version; rustc --version; } > work/ci/host.txt
      - name: Validate bundled JIT framework compiler compatibility
        shell: bash
        run: |
          set -euo pipefail
          printf 'import StikJIT\n' > work/ci/check-stikjit.swift
          xcrun swiftc -typecheck -target arm64-apple-ios26.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F app/Frameworks/StikJIT.xcframework/ios-arm64 \
            work/ci/check-stikjit.swift 2>&1 | tee work/ci/stikjit-import.txt
      - name: Bootstrap toolchain and Wine headers
        shell: bash
        run: |
          set -euo pipefail
          bash build/ci/bootstrap-wine.sh 2>&1 | tee work/ci/bootstrap-wine.txt
      - name: Reconstruct and validate wineserver from source
        shell: bash
        run: |
          set -euo pipefail
          bash build/wineserver/build.sh 2>&1 | tee work/ci/wineserver.txt
      - name: Bootstrap LLVM iOS and FreeType sources
        shell: bash
        run: |
          set -euo pipefail
          bash build/ci/bootstrap-libraries.sh 2>&1 | tee work/ci/bootstrap-libraries.txt
      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Native build readiness
        run: python3 tools/ci/audit_inputs.py --require-native --output work/ci/native-inputs.json
      - name: Compile application and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          bash build/ci/build-ios.sh 2>&1 | tee work/ci/native-build.txt
      - name: Preserve compiler and linker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-evidence
          path: |
            work/ci/
            build/**/*.err
            build/**/err-*.txt
            build/**/*.log
            build/wineserver/obj/**/sources.tsv
            build/wineserver/obj/**/members.txt
            build/wineserver/obj/**/symbols.txt
            build/wineserver/obj/**/undefined.txt
            build/wineserver/obj/**/SHA256SUMS
            build/wineserver/obj/**/libwineserver.a
            wine/build-*/config.log
            toolchains/llvm-*/CMakeCache.txt
            toolchains/llvm-*/CMakeFiles/CMakeConfigureLog.yaml
            work/DerivedData/Logs/Build/
          retention-days: 14
      - name: Unsigned package (only after successful native build)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Madeira-unsigned-${{ github.sha }}
          path: work/package/
          if-no-files-found: error
          retention-days: 7
